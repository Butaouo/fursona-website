name: Test and deploy LongDay to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Read-only verification mode
        default: google
        options: [google, production, audit]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/diagnostics/google-publication' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'google' || inputs.mode == 'production')
    outputs:
      body_digest: ${{ steps.google_proof.outputs.body_digest }}
      title_digest: ${{ steps.google_proof.outputs.title_digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify fresh published Google diary without deploying
        id: google_proof
        env:
          PROOF_REQUIRE_LIVE: ${{ inputs.mode == 'production' && 'true' || 'false' }}
          GOOGLE_SYNC_ENABLED: ${{ vars.GOOGLE_SYNC_ENABLED }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBLICATION_SHEET_ID: ${{ secrets.GOOGLE_PUBLICATION_SHEET_ID }}
          GOOGLE_RELATIONSHIP_FOLDER_ID: ${{ secrets.GOOGLE_RELATIONSHIP_FOLDER_ID }}
          GOOGLE_ALLOW_EMPTY_PUBLICATION: ${{ vars.GOOGLE_ALLOW_EMPTY_PUBLICATION }}
        run: |
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import { sync, rows, selectTab, published } from './scripts/google-sync.mjs';
          
          const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          let row, document, documentRequests = 0;
          let stage = 'initial'; const requestStages = [];
          const request = async (url, options = {}) => {
            const address = new URL(url);
            const response = await fetch(url, { ...options, cache: 'no-store', headers: { ...options.headers, 'Cache-Control': 'no-cache' } });
            requestStages.push({ service: address.hostname === 'oauth2.googleapis.com' ? 'authentication' : address.hostname === 'sheets.googleapis.com' ? 'sheet' : address.hostname === 'docs.googleapis.com' ? 'document' : 'media', status: response.status });
            if (address.hostname === 'sheets.googleapis.com' && response.ok) {
              const data = await response.clone().json();
              stage = 'publication-row';
              row = rows(data.valueRanges?.[0]?.values).find(value => value.id === 'diary-01');
              assert(row && typeof row.title === 'string' && row.title.trim() && row.kind === 'diary' && published(row), 'The selected diary must still be explicitly published');
            }
            if (address.hostname === 'docs.googleapis.com' && response.ok && address.pathname.endsWith(`/${row?.docId}`)) {
              document = await response.clone().json();
              documentRequests++;
            }
            return response;
          };
          
          try {
            stage = 'synchronize';
            const result = await sync({ request });
            stage = 'document-selection';
            assert.equal(documentRequests, 1, 'Read the selected document directly from Google');
            const catalog = JSON.parse(await readFile('public/content/catalog.json', 'utf8'));
            const article = catalog.articles.find(value => value.id === 'diary-01');
            assert(article && document);
            const tab = selectTab(document, row.tabId);
            const paragraphs = (tab.body?.content || []).filter(entry => entry.paragraph).map(entry => entry.paragraph);
            const nonempty = paragraphs.filter(paragraph => {
              const text = (paragraph.elements || []).map(element => element.textRun?.content || '').join('');
              return text.trim() && text.trim() !== '---';
            });
            const originalRuns = paragraphs.flatMap(paragraph => (paragraph.elements || []).filter(element => element.textRun).map(element => ({
              text: element.textRun.content || '',
              ...(element.textRun.textStyle?.bold ? { bold: true } : {}),
              ...(element.textRun.textStyle?.italic ? { italic: true } : {}),
            })));
            const renderedRuns = article.blocks.filter(block => block.type === 'paragraph' || block.type === 'heading').flatMap(block => block.runs);
            stage = 'compare-runs';
            assert.deepEqual(renderedRuns, originalRuns, 'Keep all source text runs, punctuation, newlines and bold/italic formatting');
            const sourceText = originalRuns.map(run => run.text).join('');
            stage = 'live-catalog';
            const liveResponse = await fetch('https://longday.tw/content/catalog.json', { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
            assert(liveResponse.ok);
            const live = (await liveResponse.json()).articles.find(value => value.id === 'diary-01');
            const proof = {
              ...result, status: 'verified', fetchedAt: new Date().toISOString(), id: 'diary-01',
              published: row.publishStatus === 'published', freshDocumentRequests: documentRequests,
              sourceCharacters: sourceText.length, sourceParagraphs: nonempty.length,
              totalSourceParagraphs: paragraphs.length,
              allSourceCharacters: paragraphs.flatMap(paragraph => (paragraph.elements || []).map(element => element.textRun?.content || '')).join('').length,
              allSourceTextMatchesOutput: paragraphs.flatMap(paragraph => (paragraph.elements || []).map(element => element.textRun?.content || '')).join('') === sourceText,
              sourceLineBreaks: (sourceText.match(/\n/g) || []).length,
              blocks: article.blocks.length, sourceRunsMatchOutput: true,
              sourceTextDigest: digest(sourceText), formattingDigest: digest(originalRuns),
              bodyDigest: digest(article.blocks), liveBodyDigest: live ? digest(live.blocks) : null,
              liveMatchesFreshGoogle: !!live && digest(live.blocks) === digest(article.blocks),
              titleDigest: digest(row.title), liveTitleMatchesSource: !!live && live.title?.['zh-TW'] === row.title,
              };
            await mkdir('reports', { recursive: true });
            await writeFile('reports/google-diary-proof.json', JSON.stringify(proof, null, 2));
            console.log(JSON.stringify(proof));
            stage = 'live-match';
            if (process.env.PROOF_REQUIRE_LIVE === 'true') assert(proof.liveMatchesFreshGoogle && proof.liveTitleMatchesSource, 'The live publication must match the current explicitly published source');
            if (process.env.GITHUB_OUTPUT) await writeFile(process.env.GITHUB_OUTPUT, `body_digest=${proof.bodyDigest}\ntitle_digest=${proof.titleDigest}\n`);
          } catch (error) {
            // Never print a response, source URL, identifier, document body or assertion diff.
            console.error(JSON.stringify({ status: 'verification-failed', stage, errorType: error?.name, requestStages, rowFound: !!row, published: !!row && published(row), expectedKind: row?.kind === 'diary', expectedTitle: row?.title === '台灣', bareDocId: /^[a-zA-Z0-9_-]+$/.test(row?.docId || ''), documentRequests }));
            process.exitCode = 1;
          }
          VERIFY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: longday-fresh-google-diary-proof
          path: reports/google-diary-proof.json
          retention-days: 30
  verify-production:
    needs: diagnose
    env:
      EXPECTED_GOOGLE_BODY_DIGEST: ${{ needs.diagnose.outputs.body_digest }}
      EXPECTED_GOOGLE_TITLE_DIGEST: ${{ needs.diagnose.outputs.title_digest }}
    if: github.ref == 'refs/heads/diagnostics/google-publication' && inputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify published diary and responsive routes on longday.tw
        run: |
          xvfb-run -a node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { chromium, firefox, webkit, devices, request, expect } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';
          import { characterText } from './src/config/characterCopy.ts';
          
          const origin = 'https://longday.tw/';
          const expectedBodyDigest = process.env.EXPECTED_GOOGLE_BODY_DIGEST;
          const expectedTitleDigest = process.env.EXPECTED_GOOGLE_TITLE_DIGEST;
          assert(/^[a-f0-9]{64}$/.test(expectedBodyDigest || '') && /^[a-f0-9]{64}$/.test(expectedTitleDigest || ''));
          const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const api = await request.newContext({ extraHTTPHeaders: { 'Cache-Control': 'no-cache' } });
          const response = await api.get(`${origin}content/catalog.json`);
          assert.equal(response.status(), 200);
          const catalog = await response.json();
          const article = catalog.articles.find(value => value.id === 'diary-01');
          assert(article && article.kind === 'diary' && typeof article.title['zh-TW'] === 'string');
          assert.equal(digest(article.title['zh-TW']), expectedTitleDigest, 'Use the current author-published title from Sheets');
          assert.equal(digest(article.blocks), expectedBodyDigest, 'Production must contain the newly fetched Google body');
          const textBlocks = article.blocks.filter(block => block.type === 'paragraph' || block.type === 'heading');
          const expectedText = textBlocks.map(block => block.runs.map(run => run.text).join(''));
          const profiles = [
            ['desktop-chromium', chromium, { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 } }],
            ['desktop-firefox', firefox, devices['Desktop Firefox']],
            ['desktop-webkit', webkit, devices['Desktop Safari']],
            ['iphone-webkit', webkit, devices['iPhone 13']],
            ['android-chromium', chromium, devices['Pixel 7']],
          ];
          const results = [];
          await mkdir('reports', { recursive: true });
          try {
            for (const [name, engine, options] of profiles) {
              const browser = await engine.launch();
              try {
                const context = await browser.newContext({ ...options, locale: 'zh-TW', colorScheme: 'light' });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', error => errors.push(error.message));
                page.on('response', result => { if (result.url().startsWith(origin) && result.status() >= 400) errors.push(`Resource HTTP ${result.status()}`); });
                const noOverflow = async () => assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth));
                const quote = position => page.locator(`[data-copy-position="${position}"] [data-copy-current]`);
                const pictureLoaded = image => expect.poll(() => image.evaluate(node => node.complete && node.naturalWidth > 0)).toBe(true);
                const theme = async choice => {
                  await page.getByTestId(`theme-${choice}`).click();
                  await expect(page.locator('html')).toHaveAttribute('data-theme', choice);
                };
                await page.goto(origin, { waitUntil: 'domcontentloaded' });
                const opening = page.getByTestId('opening');
                await expect(opening).toHaveAttribute('data-phase', 'playing', { timeout: 12000 });
                await expect(opening.locator('.shutter-bottom')).toHaveCSS('animation-duration', '4.6s');
                await expect(page.getByRole('button', { name: /Skip Intro|跳過動畫/i })).toHaveCount(0);
                await expect(opening).toHaveCount(0, { timeout: 7000 });
                await expect(page.locator('#hero-heading')).toContainText('久天');
                await pictureLoaded(page.locator('.hero-image'));
                await expect(page.locator('.social-grid > .social-link')).toHaveCount(11);
                assert.equal(await page.locator('.social-panel details,.social-panel [aria-expanded]').count(), 0);
                await expect(page.getByRole('heading', { name: 'Younger', exact: true })).toBeVisible();
                await expect(page.getByTestId('apple-player')).toHaveCount(0);
                await expect(page.locator('.music-external')).toHaveAttribute('href', 'https://music.apple.com/tw/album/younger/1814208594?i=1814208601');
                for (const choice of ['light', 'dark']) {
                  await theme(choice);
                  await expect(quote('home')).toHaveText(characterText('home', choice, 'zh-TW'));
                  await expect(quote('artwork')).toHaveText(characterText('artwork', choice, 'zh-TW'));
                  await expect(page.locator('[data-copy-position="artwork"] .theme-copy-ink')).toHaveCount(1);
                  await noOverflow();
                  await page.screenshot({ path: `reports/${name}-release-home-${choice}.png`, fullPage: false });
                }
                const lights = page.locator('.orb-one');
                const beforeLight = await lights.evaluate(node => getComputedStyle(node).transform);
                await expect.poll(() => lights.evaluate(node => getComputedStyle(node).transform)).not.toBe(beforeLight);
                await page.getByTestId('theme-system').click();
                for (const choice of ['light', 'dark']) {
                  await page.emulateMedia({ colorScheme: choice });
                  await expect(quote('home')).toHaveText(characterText('home', choice, 'zh-TW'));
                }
                await page.getByRole('button', { name: 'Switch to English', exact: true }).click();
                await expect(quote('home')).toHaveText(characterText('home', 'dark', 'en'));
                await page.getByRole('button', { name: '切換為繁體中文', exact: true }).click();
                await page.goto(`${origin}#/about`);
                await expect(page.locator('.character-file')).toBeVisible();
                for (const choice of ['light', 'dark']) {
                  await theme(choice);
                  await expect(quote('narration')).toHaveText(characterText('narration', choice, 'zh-TW'));
                  await expect(quote('character')).toHaveText(characterText('character', choice, 'zh-TW'));
                  await expect(page.locator('.name-meaning dd')).toHaveText('希望日落能停留得更久');
                  const foreground = choice === 'dark' ? 'rgb(247, 240, 228)' : 'rgb(48, 43, 34)';
                  await expect(page.locator('body')).toHaveCSS('color', foreground);
                  for (const label of await page.locator('.file-facts dd,.color-label > span').all()) await expect(label).toHaveCSS('color', foreground);
                  await expect(page.locator('[data-copy-position="character"] .theme-copy-ink')).toHaveCount(1);
                  await noOverflow();
                  await page.screenshot({ path: `reports/${name}-release-character-${choice}.png`, fullPage: false });
                }
                for (const label of ['穿衣設定', '毛色設定', '角色插畫']) {
                  await page.getByRole('tab', { name: label, exact: true }).click();
                  const image = page.locator('[role="tabpanel"]:not([hidden]) img');
                  await expect(image).toBeVisible(); await pictureLoaded(image);
                }
                await page.getByRole('button', { name: '查看完整圖片', exact: true }).click();
                await expect(page.getByRole('dialog')).toBeVisible();
                await page.getByRole('button', { name: '全螢幕檢視', exact: true }).click();
                await expect(page.getByRole('dialog')).toHaveClass(/is-expanded/);
                await page.getByRole('button', { name: '關閉', exact: true }).click();
                await expect(page.getByRole('dialog')).not.toBeVisible();
                await page.goto(`${origin}#/archive`);
                await page.getByRole('button', { name: '日記', exact: true }).click();
                await page.locator('a.archive-card[href="#/archive/diary-01"]').click();
                await expect(page).toHaveURL(`${origin}#/archive/diary-01`);
                const paragraphs = page.locator('.reader-body > p,.reader-body > h2,.reader-body > h3');
                await expect(paragraphs).toHaveCount(textBlocks.length);
                assert.deepEqual(await paragraphs.allTextContents(), expectedText);
                const allSpans = page.locator('.reader-body > p > span,.reader-body > h2 > span,.reader-body > h3 > span');
                const runs = textBlocks.flatMap(block => block.runs);
                await expect(allSpans).toHaveCount(runs.length);
                for (let i = 0; i < runs.length; i++) {
                  await expect(allSpans.nth(i)).toHaveText(runs[i].text, { useInnerText: false });
                  if (runs[i].bold) assert(Number(await allSpans.nth(i).evaluate(node => getComputedStyle(node).fontWeight)) >= 700);
                  if (runs[i].italic) await expect(allSpans.nth(i)).toHaveCSS('font-style', 'italic');
                }
                await noOverflow();
                await page.screenshot({ path: `reports/${name}-release-diary.png`, fullPage: false });
                await page.reload();
                await expect(paragraphs).toHaveCount(textBlocks.length);
                assert.deepEqual(await paragraphs.allTextContents(), expectedText);
                await page.getByRole('button', { name: 'Switch to English', exact: true }).click();
                await expect(page.locator('html')).toHaveAttribute('lang', 'en');
                assert.deepEqual(await paragraphs.allTextContents(), expectedText);
                for (const [route, heading] of [['relationships', 'Relationships'], ['shop', 'Shop']]) {
                  await page.goto(`${origin}#/${route}`);
                  await expect(page.locator('main h1')).toContainText(heading); await noOverflow();
                }
                await page.goto(origin);
                await expect(page.locator('#hero-heading')).toBeVisible();
                await expect(page.getByTestId('opening')).toHaveCount(0);
                await page.getByRole('button', { name: 'Pause animation', exact: true }).click();
                await expect(page.locator('html')).toHaveAttribute('data-motion', 'still');
                await expect(lights).toHaveCSS('animation-name', 'none');
                await page.getByRole('button', { name: 'Enable animation', exact: true }).click();
                await expect(page.locator('html')).toHaveAttribute('data-motion', 'full');
                await page.emulateMedia({ reducedMotion: 'reduce' });
                await expect(lights).toHaveCSS('animation-name', 'none');
                const accessibility = await new AxeBuilder({ page }).withTags(['wcag2a', 'wcag2aa', 'wcag21aa']).analyze();
                assert.deepEqual(accessibility.violations, []);
                assert.deepEqual(errors, []);
                const result = { profile: name, status: 'passed', bodyDigest: digest(article.blocks), textBlocks: textBlocks.length, sourceCharacters: expectedText.join('').length, latestGoogleBody: true, opening: true, themeCopy: true, systemTheme: true, socialGrid: 11, artwork: true, gallery: true, fullscreen: true, refresh: true, preferences: true, motionControls: true, errors: 0, simulation: name.includes('iphone') || name.includes('android') };
                results.push(result); console.log(JSON.stringify(result));
              } finally { await browser.close(); }
            }
            await writeFile('reports/release-verification.json', JSON.stringify(results, null, 2));
          } finally { await api.dispose(); }
          VERIFY
      - name: Audit the live HTTPS site
        env:
          AUDIT_URL: https://longday.tw/
        run: node scripts/lighthouse.mjs
      - name: Upload production verification screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: longday-published-diary-verification
          path: reports/
          retention-days: 30

  audit-candidate:
    if: github.ref == 'refs/heads/diagnostics/google-publication' && github.event_name == 'workflow_dispatch' && inputs.mode == 'audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: fix/first-paint-layout
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure the unchanged acceptance gates
        run: npm run audit
      - name: Explain the measured bottlenecks
        if: always()
        run: |
          node --input-type=module <<'AUDIT'
          import { readFile } from 'node:fs/promises';
          for (const profile of ['mobile','desktop']) {
            const report = JSON.parse(await readFile(`reports/lighthouse-${profile}.json`, 'utf8'));
            const keys = ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','mainthread-work-breakdown','bootup-time','long-tasks','lcp-breakdown-insight','forced-reflow-insight','network-dependency-tree-insight'];
            console.log(JSON.stringify({profile,audits:Object.fromEntries(keys.filter(key=>report.audits[key]).map(key=>[key,report.audits[key]]))}));
          }
          AUDIT
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: longday-candidate-performance-diagnostics
          path: reports/
          retention-days: 30




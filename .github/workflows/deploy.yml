name: Test and deploy LongDay to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Read-only verification mode
        default: google
        options: [google, production]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/diagnostics/google-publication' && github.event_name == 'workflow_dispatch' && inputs.mode != 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: 74232fd1b40eb23159a725aac5821ae4ab790270
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Diagnose published-only Google sync without deploying
        env:
          GOOGLE_SYNC_ENABLED: ${{ vars.GOOGLE_SYNC_ENABLED }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBLICATION_SHEET_ID: ${{ secrets.GOOGLE_PUBLICATION_SHEET_ID }}
          GOOGLE_RELATIONSHIP_FOLDER_ID: ${{ secrets.GOOGLE_RELATIONSHIP_FOLDER_ID }}
          GOOGLE_ALLOW_EMPTY_PUBLICATION: ${{ vars.GOOGLE_ALLOW_EMPTY_PUBLICATION }}
        run: |
          node --input-type=module <<'DIAGNOSTIC'
          import { createPrivateKey } from 'node:crypto';
          
          let stage = 'configuration';
          const report = value => console.log(JSON.stringify(value));
          const stop = reason => { report({ status: 'failed', stage, reason }); process.exit(1); };
          const env = process.env;
          report({ stage, enabled: env.GOOGLE_SYNC_ENABLED === 'true', credentialsPresent: !!env.GOOGLE_SERVICE_ACCOUNT_JSON, sheetPresent: !!env.GOOGLE_PUBLICATION_SHEET_ID });
          if (env.GOOGLE_SYNC_ENABLED !== 'true') stop('SYNC_DISABLED');
          let credentials;
          try { credentials = JSON.parse(env.GOOGLE_SERVICE_ACCOUNT_JSON || '{}'); } catch { stop('SERVICE_ACCOUNT_NOT_VALID_JSON'); }
          if (!credentials || typeof credentials !== 'object' || Array.isArray(credentials)) stop('SERVICE_ACCOUNT_NOT_AN_OBJECT');
          if (typeof credentials.client_email !== 'string' || !credentials.client_email.endsWith('.iam.gserviceaccount.com')) stop('SERVICE_ACCOUNT_EMAIL_MISSING_OR_INVALID');
          if (typeof credentials.private_key !== 'string') stop('SERVICE_ACCOUNT_PRIVATE_KEY_MISSING');
          try { createPrivateKey(credentials.private_key); } catch { stop('SERVICE_ACCOUNT_PRIVATE_KEY_INVALID'); }
          const originalSheet = env.GOOGLE_PUBLICATION_SHEET_ID || '';
          const trimmedSheet = originalSheet.trim();
          if (/^[\w-]{10,200}$/.test(trimmedSheet)) {
            // Keep the original environment value; the checked-out sync must normalize it.
            report({ stage, sheetFormat: originalSheet === trimmedSheet ? 'bare-id' : 'id-with-outer-whitespace' });
          } else {
            let link;
            try { link = new URL(trimmedSheet); } catch { stop('SHEET_ID_NOT_IDENTIFIER_OR_URL'); }
            const match = link.pathname.match(/^\/spreadsheets\/d\/([\w-]{10,200})(?:\/|$)/);
            if (link.protocol !== 'https:' || link.hostname !== 'docs.google.com' || link.username || link.password || link.port || !match) stop('SHEET_URL_NOT_APPROVED_GOOGLE_SHEETS_LINK');
            // Normalize only inside this read-only process. Never alter repository Secrets.
            // Keep the original environment value; the checked-out sync must normalize it.
            report({ stage, sheetFormat: 'full-google-sheets-url', normalizationDelegatedToCheckedOutSync: true });
          }
          report({ stage, status: 'valid' });
          
          const reasons = new Set(['invalid_grant', 'invalid_client', 'unauthorized_client', 'access_denied', 'invalid_scope', 'PERMISSION_DENIED', 'NOT_FOUND', 'INVALID_ARGUMENT', 'UNAUTHENTICATED', 'FAILED_PRECONDITION', 'SERVICE_DISABLED', 'accessNotConfigured', 'forbidden', 'notFound', 'badRequest', 'insufficientPermissions', 'SERVICE_USAGE_DENIED']);
          const request = async (url, options) => {
            const host = new URL(url).hostname;
            stage = host === 'oauth2.googleapis.com' ? 'google-authentication' : host === 'sheets.googleapis.com' ? 'google-sheets' : host === 'docs.googleapis.com' ? 'google-docs' : host.endsWith('googleusercontent.com') ? 'document-image' : 'google-drive';
            const response = await fetch(url, options);
            report({ stage, http: response.status });
            if (!response.ok && ![301,302,303,307,308].includes(response.status)) {
              try {
                const data = await response.clone().json();
                const candidates = typeof data.error === 'string' ? [data.error] : [data.error?.status, ...(data.error?.errors || []).map(e => e.reason), ...(data.error?.details || []).map(e => e.reason)];
                report({ stage, apiReasons: candidates.filter(x => reasons.has(x)) });
              } catch { /* Never emit API response text, descriptions, URLs or identifiers. */ }
            }
            if (stage === 'google-sheets' && response.ok) {
              const data = await response.clone().json();
              const values = data.valueRanges?.[0]?.values || [];
              const [headers = [], ...rows] = values;
              const row = rows.map(values => Object.fromEntries(headers.map((h,i) => [h,String(values[i] ?? '').trim()]))).find(r => r.id === 'diary-01');
              report({ stage: 'article-row-check', found: !!row, ...(row ? { titleMatches: row.title === '台灣', kindMatches: row.kind === 'diary', published: row.publishStatus === 'published', dateValid: /^\d{4}-\d{2}-\d{2}$/.test(row.date || ''), dateNotFuture: !!row.date && row.date <= new Date().toISOString().slice(0,10), docIdValid: /^[\w-]{10,200}$/.test(row.docId || ''), tabSpecified: !!row.tabId } : {}) });
            }
            if (stage === 'google-docs' && response.ok) {
              const document = await response.clone().json();
              const count = tabs => tabs.reduce((n,t) => n + 1 + count(t.childTabs || []), 0);
              report({ stage: 'document-structure', tabCount: count(document.tabs || []) });
            }
            return response;
          };
          
          try {
            const { sync } = await import('./scripts/google-sync.mjs');
            report(await sync({ request }));
          } catch (error) {
            const known = new Map([
              ['Invalid Google identifier in publication configuration','INVALID_GOOGLE_IDENTIFIER'],
              ['Both Articles and Products sheets are required','ARTICLES_AND_PRODUCTS_REQUIRED'],
              ['Duplicate Sheet column','DUPLICATE_COLUMN'],
              ['Published article requires date, title and kind','PUBLISHED_ARTICLE_FIELDS_INVALID'],
              ['Multiple document tabs: choose the published tabId explicitly','TAB_SELECTION_REQUIRED'],
              ['Published document tab not found','TAB_NOT_FOUND'],
              ['Unsupported document structure: use paragraphs, headings and inline images, not tables','UNSUPPORTED_TABLE_OR_STRUCTURE'],
              ['Floating images must be changed to inline before publication','FLOATING_IMAGE_NOT_INLINE'],
              ['Unsupported embedded object; use an inline image','UNSUPPORTED_EMBEDDED_OBJECT'],
              ['Unsupported paragraph element; publication stopped without replacing the live site','UNSUPPORTED_PARAGRAPH_ELEMENT'],
              ['Refusing to publish an empty document','EMPTY_DOCUMENT'],
              ['Invalid article','ARTICLE_SCHEMA_INVALID'],
              ['Invalid ID','ARTICLE_OR_PRODUCT_ID_INVALID'],
              ['Empty publication refused; explicit GOOGLE_ALLOW_EMPTY_PUBLICATION is required','EMPTY_PUBLICATION_REFUSED']
            ]);
            stop(known.get(error?.message) || 'SYNC_ERROR_DETAILS_WITHHELD');
          }
          DIAGNOSTIC

  verify-production:
    if: github.ref == 'refs/heads/diagnostics/google-publication' && inputs.mode == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify published diary and responsive routes on longday.tw
        run: |
          xvfb-run -a node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdir } from 'node:fs/promises';
          import { chromium, firefox, webkit, devices, request } from '@playwright/test';
          
          const origin = 'https://longday.tw/';
          const api = await request.newContext();
          const response = await api.get(`${origin}content/catalog.json`);
          assert.equal(response.status(), 200, 'Published catalog must load over HTTPS');
          const catalog = await response.json();
          const article = catalog.articles.find(a => a.id === 'diary-01');
          assert(article && article.title['zh-TW'] === '台灣' && article.kind === 'diary', 'Published diary must exist');
          assert(article.blocks.length > 0, 'Published article must contain its body');
          const expectedText = article.blocks.filter(b => b.type === 'paragraph' || b.type === 'heading').map(b => b.runs.map(r => r.text).join(''));
          const digest = value => createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const profiles = [
            ['desktop-chromium', chromium, { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 } }],
            ['desktop-firefox', firefox, devices['Desktop Firefox']],
            ['desktop-webkit', webkit, devices['Desktop Safari']],
            ['iphone-webkit', webkit, devices['iPhone 13']],
            ['android-chromium', chromium, devices['Pixel 7']],
          ];
          await mkdir('reports', { recursive: true });
          try {
            for (const [name, engine, options] of profiles) {
              const browser = await engine.launch();
              try {
                const context = await browser.newContext({ ...options, locale: 'zh-TW', colorScheme: 'light' });
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                page.on('response', r => { if (r.url().startsWith(origin) && r.status() >= 400) errors.push(`Resource HTTP ${r.status()}`); });
                const { expect } = await import('@playwright/test');
                const noOverflow = async () => assert(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth), 'No horizontal overflow');
                await page.goto(`${origin}#/archive`, { waitUntil: 'domcontentloaded' });
                await expect(page.locator('main h1')).toContainText('創作');
                await expect(page.getByTestId('opening')).toHaveCount(0, { timeout: 19000 });
                await page.getByRole('button', { name: '日記', exact: true }).click();
                const card = page.locator('.archive-card').filter({ has: page.getByRole('heading', { name: '台灣', exact: true }) });
                await expect(card).toBeVisible();
                await noOverflow();
                await page.screenshot({ path: `reports/${name}-published-archive.png`, fullPage: false });
                await card.click();
                await expect(page).toHaveURL(`${origin}#/archive/diary-01`);
                await expect(page.locator('.reader-heading h1')).toContainText('台灣');
                const rendered = page.locator('.reader-body > p, .reader-body > h2, .reader-body > h3');
                await expect(rendered).toHaveCount(expectedText.length);
                assert.equal(digest(await rendered.allTextContents()), digest(expectedText), 'Reader must preserve every published text block');
                await noOverflow();
                await page.screenshot({ path: `reports/${name}-published-diary.png`, fullPage: false });
                await page.reload();
                await expect(page.locator('.reader-heading h1')).toContainText('台灣');
                assert.equal(digest(await rendered.allTextContents()), digest(expectedText), 'Direct refresh must preserve the full body');
                const currentUrl = page.url();
                for (const theme of ['dark', 'light']) {
                  await page.getByTestId(`theme-${theme}`).click();
                  await expect(page.locator('html')).toHaveAttribute('data-theme', theme);
                  assert.equal(page.url(), currentUrl);
                  await expect(page.getByTestId('opening')).toHaveCount(0);
                  await noOverflow();
                }
                await page.getByRole('button', { name: 'Switch to English', exact: true }).click();
                await expect(page.locator('html')).toHaveAttribute('lang', 'en');
                assert.equal(page.url(), currentUrl);
                assert.equal(digest(await rendered.allTextContents()), digest(expectedText), 'Language switch must not rewrite the author body');
                await noOverflow();
                for (const [route, heading] of [['about','Character'], ['relationships','Relationships'], ['shop','Shop'], ['',null]]) {
                  await page.goto(`${origin}#/${route}`);
                  if (heading) await expect(page.locator('main h1')).toContainText(heading);
                  else await expect(page.locator('#hero-heading')).toBeVisible();
                  await noOverflow();
                }
                await expect(page.locator('.social-grid > .social-link')).toHaveCount(11);
                await expect(page.locator('.hero-image')).toBeVisible();
                await expect.poll(() => page.locator('.hero-image').evaluate(n => n.complete && n.naturalWidth > 0)).toBe(true);
                assert.deepEqual(errors, [], 'No fatal JavaScript errors or same-origin resource failures');
                console.log(JSON.stringify({ profile: name, status: 'passed', article: 'diary-01', bodyMatchesCatalog: true, textBlocks: expectedText.length, responsive: true, refresh: true, preferences: true, otherRoutes: true, errors: 0, simulation: name.includes('iphone') || name.includes('android') }));
              } finally { await browser.close(); }
            }
          } finally { await api.dispose(); }
          VERIFY
      - name: Upload production verification screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: longday-published-diary-verification
          path: reports/
          retention-days: 30

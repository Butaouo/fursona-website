name: Test and deploy LongDay to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: TypeScript and production build
        id: build
        run: npm run build
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Compare WebKit display backends
        run: |
          xvfb-run -a node --input-type=module <<'NODE'
          import { webkit } from '@playwright/test';
          import { spawn } from 'node:child_process';
          const url = 'http://127.0.0.1:4173/fursona-website/';
          const server = spawn('node', ['node_modules/vite/bin/vite.js', 'preview', '--host', '127.0.0.1', '--port', '4173'], { stdio: 'ignore' });
          try {
            for (let i = 0; i < 40; i++) {
              try { if ((await fetch(url)).ok) break; } catch {}
              await new Promise(r => setTimeout(r, 250));
            }
            for (const headless of [true, false]) {
              const browser = await webkit.launch({ headless });
              try {
                const page = await browser.newPage();
                for (const content of ['blank', 'website']) {
                  if (content === 'blank') await page.setContent('<button>Display clock probe</button>');
                  else await page.goto(url);
                  const variants = content === 'blank' ? [['baseline', '']] : [
                    ['baseline', ''],
                    ['no-noise', '.ambient-grain{display:none!important}'],
                    ['no-backdrop', '.glass,.glass-button{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}'],
                    ['no-orb-blur', '.ambient-orb{filter:none!important}'],
                    ['no-refraction', '.glass-optics:before{filter:none!important}'],
                    ['no-canvas', '.ambient canvas{display:none!important}'],
                  ];
                  for (const [effect, css] of variants) {
                    const style = css ? await page.addStyleTag({ content: css }) : null;
                    const sample = await page.evaluate(() => new Promise(resolve => {
                      let frames = 0, id = 0;
                      const start = performance.now();
                      const tick = () => { frames++; id = requestAnimationFrame(tick); };
                      id = requestAnimationFrame(tick);
                      setTimeout(() => { cancelAnimationFrame(id); resolve({ frames, durationMs: performance.now() - start, visibility: document.visibilityState, quality: document.documentElement.dataset.quality }); }, 2000);
                    }));
                    console.log(JSON.stringify({ engine: 'webkit', headless, content, effect, ...sample }));
                    if (style) await style.evaluate(node => node.remove());
                  }
                }
              } finally { await browser.close(); }
            }
          } finally { server.kill(); }
          NODE
      - name: Test desktop, mobile, preferences, music, links and accessibility
        run: xvfb-run -a npm run test:e2e -- --headed
      - name: Audit mobile and desktop performance
        if: success() || (failure() && steps.build.outcome == 'success')
        run: npm run audit
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ github.sha }}
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 30
      - name: Upload production site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$PAGES_URL" --output /tmp/longday-page.html && grep -q 'LongDay' /tmp/longday-page.html; then
              echo "Verified $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1

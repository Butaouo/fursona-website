name: Verify the opening geometry in all requested browsers
on:
  workflow_dispatch:
    inputs:
      diagnose_google:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Check timing and geometry across all five browser profiles
        run: xvfb-run -a npx playwright test tests/opening.e2e.ts --grep 'full-width gold line' --headed

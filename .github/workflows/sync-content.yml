name: Sync LongDay Google content
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: longday-content-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.GOOGLE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.manifest.outputs.changed }}
      baseline: ${{ steps.manifest.outputs.baseline }}
      content_hash: ${{ steps.manifest.outputs.content_hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sync explicitly published Google content
        env:
          GOOGLE_SYNC_ENABLED: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PUBLICATION_SHEET_ID: ${{ secrets.GOOGLE_PUBLICATION_SHEET_ID }}
          GOOGLE_RELATIONSHIP_FOLDER_ID: ${{ secrets.GOOGLE_RELATIONSHIP_FOLDER_ID }}
          GOOGLE_ALLOW_EMPTY_PUBLICATION: ${{ vars.GOOGLE_ALLOW_EMPTY_PUBLICATION }}
        run: node scripts/google-sync.mjs
      - name: Compare content with the deployed version
        id: manifest
        run: node scripts/publication-manifest.mjs compare
      - name: Test the publication and rendering rules
        if: steps.manifest.outputs.changed == 'true'
        run: npm test
      - name: Build and validate the production site
        if: steps.manifest.outputs.changed == 'true'
        run: npm run build
      - name: Upload production site
        if: steps.manifest.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pages.yml
    with:
      baseline: ${{ needs.refresh.outputs.baseline }}
      content_hash: ${{ needs.refresh.outputs.content_hash }}

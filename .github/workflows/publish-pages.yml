name: Publish verified LongDay artifact
on:
  workflow_call:
    inputs:
      baseline:
        type: string
        default: ''
      content_hash:
        type: string
        required: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: longday-production-pages
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Require a full release of this commit before refreshing content
        if: inputs.baseline != ''
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          curl --fail --silent --show-error --max-time 15 "https://longday.tw/publication-version.json?$GITHUB_RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" --arg hash "$BASELINE" '.sha == $sha and .contentHash == $hash' > /dev/null
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML
        env:
          CONTENT_HASH: ${{ inputs.content_hash }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$PAGES_URL" --output /tmp/longday-page.html && grep -q 'LongDay' /tmp/longday-page.html &&
              curl --fail --silent --show-error --max-time 15 "https://longday.tw/publication-version.json?$GITHUB_RUN_ID-$attempt" |
                jq -e --arg sha "$GITHUB_SHA" --arg hash "$CONTENT_HASH" '.sha == $sha and .contentHash == $hash' > /dev/null; then
              echo "Verified $PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          exit 1
